[project]
name = "roomscan"
version = "0.1.0"
description = "EnFractal capture pipeline: photo ingest (C1) and coverage guidance (C2)"
readme = "README.md"
# 3.12 is the interpreter MapAnything is tested on; uv provisions it (see README.md).
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.1,<2.4",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# C2 pose estimation and object detection on the local GPU. CUDA 12.6 wheels cover the
# RTX 2070 SUPER (sm_75). Heavy: about 4 GB installed.
pose = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "mapanything",
    "transformers>=4.50",
]

[project.scripts]
roomscan = "roomscan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]
# The founder's Windows machine and Linux cloud containers; the CUDA index has no macOS wheels.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
# MapAnything (Meta, Apache-2.0 code) is not on PyPI; pinned to a reviewed commit.
mapanything = { git = "https://github.com/facebookresearch/map-anything", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
