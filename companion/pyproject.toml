[project]
name = "enfractal-companion"
version = "0.1.0"
description = "Model-neutral MCP command surface for the EnFractal AI companion, with a mock game host and boundary tests."
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "jsonschema-specifications==2025.9.1",
    "rpds-py==2026.9.1",
    "attrs==26.1.0",
]

[project.scripts]
enfractal-companion = "enfractal_companion.server:main"
enfractal-companion-mock-game = "enfractal_companion.mock_game:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enfractal_companion"]
